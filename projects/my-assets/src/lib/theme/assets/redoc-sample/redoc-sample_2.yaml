openapi: 3.0.3
info:
  title: Lending as a Service (LaaS) API
  description: |
    RESTful API for managing loan applications end-to-end.
    Covers submission, document upload, status tracking, decisions, and cancellation.
  version: 1.0.0
  contact:
    name: LaaS API Support
    email: api-support@laas.io

servers:
  - url: https://api.laas.io/v1
    description: Production
  - url: https://sandbox.laas.io/v1
    description: Sandbox

security:
  - BearerAuth: []

tags:
  - name: Applications
    description: Loan application lifecycle
  - name: Documents
    description: Supporting document management

paths:
  # ---------------------------------------------------------------------------
  # Loan Applications
  # ---------------------------------------------------------------------------
  /applications:
    post:
      tags: [Applications]
      operationId: createApplication
      summary: Submit a new loan application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanApplicationRequest"
            example:
              applicant:
                first_name: Jane
                last_name: Doe
                date_of_birth: "1990-04-15"
                id_number: "12345678"
                email: jane.doe@example.com
                phone: "+254700000000"
              loan:
                amount: 50000
                currency: KES
                purpose: business_expansion
                term_months: 12
              employment:
                status: employed
                employer_name: Acme Ltd
                monthly_income: 120000
      responses:
        "201":
          description: Application created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanApplicationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    get:
      tags: [Applications]
      operationId: listApplications
      summary: List all loan applications
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ApplicationStatus"
          description: Filter by application status
        - name: from_date
          in: query
          schema:
            type: string
            format: date
          description: Filter applications submitted on or after this date
        - name: to_date
          in: query
          schema:
            type: string
            format: date
          description: Filter applications submitted on or before this date
      responses:
        "200":
          description: Paginated list of applications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /applications/{application_id}:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"

    get:
      tags: [Applications]
      operationId: getApplication
      summary: Retrieve a loan application by ID
      responses:
        "200":
          description: Application details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanApplicationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Applications]
      operationId: updateApplication
      summary: Update a draft loan application
      description: Only applications in `draft` status can be updated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanApplicationUpdateRequest"
      responses:
        "200":
          description: Application updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanApplicationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /applications/{application_id}/submit:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"

    post:
      tags: [Applications]
      operationId: submitApplication
      summary: Submit a draft application for review
      description: Transitions the application from `draft` to `submitted`.
      responses:
        "200":
          description: Application submitted for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanApplicationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /applications/{application_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"

    post:
      tags: [Applications]
      operationId: cancelApplication
      summary: Cancel a loan application
      description: Allowed for applications in `draft` or `submitted` status only.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
                  example: Applicant no longer requires the loan.
      responses:
        "200":
          description: Application cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanApplicationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /applications/{application_id}/decision:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"

    get:
      tags: [Applications]
      operationId: getDecision
      summary: Retrieve the underwriting decision for an application
      responses:
        "200":
          description: Decision details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Decision not yet available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Documents
  # ---------------------------------------------------------------------------
  /applications/{application_id}/documents:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"

    post:
      tags: [Documents]
      operationId: uploadDocument
      summary: Upload a supporting document
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, file]
              properties:
                type:
                  $ref: "#/components/schemas/DocumentType"
                file:
                  type: string
                  format: binary
                  description: PDF, JPG, or PNG — max 10 MB
      responses:
        "201":
          description: Document uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: File too large (max 10 MB)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      tags: [Documents]
      operationId: listDocuments
      summary: List all documents for an application
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DocumentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /applications/{application_id}/documents/{document_id}:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    delete:
      tags: [Documents]
      operationId: deleteDocument
      summary: Delete an uploaded document
      responses:
        "204":
          description: Document deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

# -------------------------------------------------------------------------------
# Components
# -------------------------------------------------------------------------------
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ApplicationId:
      name: application_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier of the loan application

    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1

    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Invalid request payload
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: Action not allowed in the current application state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    UnprocessableEntity:
      description: Validation errors on submitted fields
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"

  schemas:
    # ---------- Enums ----------
    ApplicationStatus:
      type: string
      enum:
        - draft
        - submitted
        - under_review
        - approved
        - rejected
        - cancelled
        - disbursed

    LoanPurpose:
      type: string
      enum:
        - business_expansion
        - working_capital
        - asset_financing
        - personal
        - education
        - medical
        - other

    EmploymentStatus:
      type: string
      enum:
        - employed
        - self_employed
        - unemployed
        - retired

    DocumentType:
      type: string
      enum:
        - national_id
        - passport
        - payslip
        - bank_statement
        - business_registration
        - kra_pin
        - utility_bill
        - other

    DecisionOutcome:
      type: string
      enum:
        - approved
        - rejected
        - referred

    # ---------- Sub-schemas ----------
    Applicant:
      type: object
      required:
        - first_name
        - last_name
        - date_of_birth
        - id_number
        - email
        - phone
      properties:
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        date_of_birth:
          type: string
          format: date
          example: "1990-04-15"
        id_number:
          type: string
          maxLength: 20
          description: National ID or passport number
        email:
          type: string
          format: email
        phone:
          type: string
          pattern: '^\+?[1-9]\d{6,14}$'
          example: "+254700000000"

    LoanDetails:
      type: object
      required:
        - amount
        - currency
        - purpose
        - term_months
      properties:
        amount:
          type: number
          format: double
          minimum: 1000
          example: 50000
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: KES
        purpose:
          $ref: "#/components/schemas/LoanPurpose"
        term_months:
          type: integer
          minimum: 1
          maximum: 84
          example: 12

    Employment:
      type: object
      required:
        - status
        - monthly_income
      properties:
        status:
          $ref: "#/components/schemas/EmploymentStatus"
        employer_name:
          type: string
          maxLength: 200
        monthly_income:
          type: number
          format: double
          minimum: 0
          example: 120000

    LoanApplicationRequest:
      type: object
      required:
        - applicant
        - loan
        - employment
      properties:
        applicant:
          $ref: "#/components/schemas/Applicant"
        loan:
          $ref: "#/components/schemas/LoanDetails"
        employment:
          $ref: "#/components/schemas/Employment"

    LoanApplicationUpdateRequest:
      type: object
      description: All fields are optional — only provided fields are updated.
      properties:
        loan:
          $ref: "#/components/schemas/LoanDetails"
        employment:
          $ref: "#/components/schemas/Employment"

    # ---------- Responses ----------
    LoanApplicationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        applicant:
          $ref: "#/components/schemas/Applicant"
        loan:
          $ref: "#/components/schemas/LoanDetails"
        employment:
          $ref: "#/components/schemas/Employment"
        submitted_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ApplicationListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LoanApplicationResponse"
        meta:
          type: object
          properties:
            total:
              type: integer
            page:
              type: integer
            limit:
              type: integer
            total_pages:
              type: integer

    DecisionResponse:
      type: object
      properties:
        application_id:
          type: string
          format: uuid
        outcome:
          $ref: "#/components/schemas/DecisionOutcome"
        approved_amount:
          type: number
          format: double
          nullable: true
          description: Present only when outcome is `approved`
        interest_rate:
          type: number
          format: double
          nullable: true
          description: Annual interest rate (%) — present when approved
        reason:
          type: string
          nullable: true
          description: Human-readable reason, especially for rejections
        decided_at:
          type: string
          format: date-time

    DocumentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        application_id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/DocumentType"
        filename:
          type: string
        mime_type:
          type: string
          example: application/pdf
        size_bytes:
          type: integer
        uploaded_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: NOT_FOUND
        message:
          type: string
          example: The requested resource was not found.

    ValidationErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: One or more fields failed validation.
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: loan.amount
              message:
                type: string
                example: Must be at least 1000.
