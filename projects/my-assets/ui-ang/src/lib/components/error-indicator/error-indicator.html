<div
  class="flex flex-col gap-4 items-center justify-center w-full h-full p-6"
  role="alert"
  aria-live="assertive"
  aria-atomic="true"
>
  <img
    src="assets/images/bb-illustration-ui/ic_asset_no_apps.svg"
    alt="Error"
    class="h-24 w-24 object-cover rounded-bl-lg"
  />

  <div class="flex flex-col gap-2 items-center justify-center">
    <p class="text-gray-600 text-lg">{{ error()?.title }}</p>
    <p class="text-gray-600/80 text-sm">
      {{ error()?.message }}
    </p>
  </div>
</div>
