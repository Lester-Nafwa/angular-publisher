<div class="relative w-full">
  <svg
    viewBox="0 0 200 110"
    class="w-full"
    role="img"
    [attr.aria-label]="label() + ' ' + clamped() + '%'"
  >
    <path
      d="M 20 100 A 80 80 0 0 1 180 100"
      fill="none"
      class="stroke-gray-200"
      stroke-width="30"
      stroke-linecap="round"
    />
    <!-- progress -->
    <path
      d="M 20 100 A 80 80 0 0 1 180 100"
      fill="none"
      [class]="strokeClass()"
      stroke-width="30"
      stroke-linecap="round"
      pathLength="100"
      stroke-dasharray="100"
      [attr.stroke-dashoffset]="dashOffset()"
    />
  </svg>

  <div class="absolute inset-x-0 bottom-0 flex flex-col items-center">
    <span class="text-5xl font-bold text-gray-900">{{ clamped() }}%</span>
    <span class="text-center p-1 mt-1 bg-white rounded-3xl w-fit text-xs">{{
      label()
    }}</span>
  </div>
</div>
